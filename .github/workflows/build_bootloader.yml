name: Build Patched CherryUF2

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi git make

      - name: Download AT32 SDK v2.0.3
        run: |
          git clone --depth 1 --branch v2.0.3 https://github.com/ArteryTek/AT32F402_405_Firmware_Library.git /tmp/at32_sdk
          mkdir -p sdk/ArteryTek/at32f402_405_library
          cp -r /tmp/at32_sdk/libraries/cmsis sdk/ArteryTek/at32f402_405_library/
          cp -r /tmp/at32_sdk/libraries/drivers sdk/ArteryTek/at32f402_405_library/

      - name: Write patch script
        run: |
          cat > /tmp/patch.py << 'PYEOF'
          import sys

          # ---- Patch 1: volume label ----
          p1 = "ports/ArteryTek/at32f402_405/boards/at32f405ccu7_hs/board.h"
          s = open(p1).read()
          assert '"CherryUF2"' in s, "volume label not found"
          s = s.replace('"CherryUF2"', '"CZMboot"')
          open(p1, "w").write(s)
          print("[OK] volume label -> CZMboot")

          # ---- Patch 2: OTGHS clock init in board_usb.c ----
          p2 = "ports/ArteryTek/at32f402_405/board_usb.c"
          s = open(p2).read()
          old = (
              "    } else {\n"
              "        crm_periph_clock_enable(CRM_OTGHS_PERIPH_CLOCK, TRUE);\n"
              "        nvic_irq_enable(OTGHS_IRQn, 0, 0);\n"
              "    }\n"
          )
          new = (
              "    } else {\n"
              "        crm_pllu_output_set(TRUE);\n"
              "        while (crm_flag_get(CRM_PLLU_STABLE_FLAG) != SET) {\n"
              "        }\n"
              "        crm_usb_clock_source_select(CRM_USB_CLOCK_SOURCE_PLLU);\n"
              "        crm_periph_clock_enable(CRM_OTGHSPHY_PERIPH_CLOCK, TRUE);\n"
              "        crm_periph_clock_enable(CRM_OTGHS_PERIPH_CLOCK, TRUE);\n"
              "        nvic_irq_enable(OTGHS_IRQn, 0, 0);\n"
              "    }\n"
          )
          assert old in s, "HS branch not found in board_usb.c"
          s = s.replace(old, new)
          open(p2, "w").write(s)
          print("[OK] board_usb.c OTGHS clocks")

          # ---- Patch 3: proper usbd_dwc2_delay_ms ----
          p3 = "lib/CherryUSB/port/dwc2/usb_glue_at.c"
          s = open(p3).read()
          marker = "void usbd_dwc2_delay_ms(uint8_t ms)\n{"
          idx = s.find(marker)
          assert idx >= 0, "delay_ms not found"
          end = s.find("\n}", idx)
          assert end >= 0, "delay_ms closing brace not found"
          end += 2
          new_fn = (
              "void usbd_dwc2_delay_ms(uint8_t ms)\n"
              "{\n"
              "    volatile uint32_t i;\n"
              "    uint32_t count = (system_core_clock / 4000U) * (uint32_t)ms;\n"
              "    for (i = 0; i < count; i++) {\n"
              "        __NOP();\n"
              "    }\n"
              "}"
          )
          s = s[:idx] + new_fn + s[end:]
          open(p3, "w").write(s)
          print("[OK] delay_ms implemented")
          PYEOF
          python3 /tmp/patch.py

          echo '=== Verify board_usb.c ==='
          grep -n 'pllu\|PLLU\|usb_clock\|OTGHSPHY\|OTGHS_PERIPH' ports/ArteryTek/at32f402_405/board_usb.c
          echo '=== Verify label ==='
          grep -n 'CZMboot\|VOLUME_LABEL' ports/ArteryTek/at32f402_405/boards/at32f405ccu7_hs/board.h
          echo '=== Verify delay_ms ==='
          grep -n -A6 'usbd_dwc2_delay_ms' lib/CherryUSB/port/dwc2/usb_glue_at.c

      - name: Build
        run: |
          cd ports/ArteryTek/at32f402_405
          make BOARD=at32f405ccu7_hs clean
          make BOARD=at32f405ccu7_hs all 2>&1
          ls -la .build/at32f405ccu7_hs/

      - uses: actions/upload-artifact@v4
        with:
          name: cherryuf2_hs_v4
          path: ports/ArteryTek/at32f402_405/.build/at32f405ccu7_hs/cherryuf2_at32f405ccu7_hs.bin
