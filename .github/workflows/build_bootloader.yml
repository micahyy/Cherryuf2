name: Build Patched CherryUF2

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-none-eabi git make

      - name: Download AT32 SDK
        run: |
          git clone --depth 1 https://github.com/ArteryTek/AT32F402_405_Firmware_Library.git /tmp/at32_sdk
          mkdir -p sdk/ArteryTek/at32f402_405_library
          cp -r /tmp/at32_sdk/libraries/cmsis sdk/ArteryTek/at32f402_405_library/
          cp -r /tmp/at32_sdk/libraries/drivers sdk/ArteryTek/at32f402_405_library/
          find sdk/ArteryTek/at32f402_405_library -name "at32f402_405.h"

      - name: Patch GCCFG for HS
        run: |
          sed -i 's/return ((1 << 16) | (1 << 21));/return ((1 << 16) | (1 << 18) | (1 << 19) | (1 << 21));/g' lib/CherryUSB/port/dwc2/usb_glue_at.c
          grep -n "return.*1 << 16" lib/CherryUSB/port/dwc2/usb_glue_at.c

      - name: Build
        run: |
          cd ports/ArteryTek/at32f402_405
          make BOARD=at32f405ccu7_hs clean
          make BOARD=at32f405ccu7_hs all
          ls -la .build/at32f405ccu7_hs/

      - uses: actions/upload-artifact@v4
        with:
          name: cherryuf2_hs_patched
          path: ports/ArteryTek/at32f402_405/.build/at32f405ccu7_hs/cherryuf2_at32f405ccu7_hs.bin
